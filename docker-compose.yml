version: "3.9"

services:
  backend:
    build: .
    container_name: analizador_backend
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app/backend
    restart: unless-stopped
    environment:
      - ANALIZADOR_HOST=0.0.0.0
      - ANALIZADOR_PUERTO=5000

  frontend:
    image: nginx:alpine
    container_name: analizador_frontend
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    depends_on:
      - backend
